# SonarQube Cloud 設定（https://sonarcloud.io）
sonar.organization=hchunkai821
sonar.projectKey=hchunkai821_jiushijian
sonar.projectName=揪時間

sonar.sources=.
sonar.inclusions=index.html,app.js,config.js,styles.css,favicon.svg,supabase/**/*.sql,.github/**/*.yml
sonar.tests=tests
sonar.test.inclusions=tests/**/*.mjs
sonar.sourceEncoding=UTF-8

# 測試覆蓋率：CI 跑端對端測試時收集 app.js 的覆蓋率
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# config.js 只有兩個設定值，測試時會換成測試資料庫的設定，不計入覆蓋率
sonar.coverage.exclusions=config.js

# supabase/migrations 每次都要重新宣告整個資料庫函式，重複是刻意的，不算進重複程式碼
sonar.cpd.exclusions=supabase/**
